# Kaskadyor.uz — static single-page site (Vite build, prerendered). No backend, no port.
# Install:  /etc/nginx/sites-available/kaskadyor.uz.conf → symlink into sites-enabled
# Needs:    /etc/nginx/snippets/kaskadyor-{security-headers,cloudflare-realip}.conf
#           Let's Encrypt cert "kaskadyor.uz" (webroot /var/www/html) covering apex, www, api.

# ── HTTP: ACME challenge + redirect everything to https://kaskadyor.uz ─────────
server {
    listen 80;
    listen [::]:80;
    server_name kaskadyor.uz www.kaskadyor.uz api.kaskadyor.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kaskadyor.uz$request_uri;
    }
}

# ── HTTPS www → apex (path kept) ───────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kaskadyor.uz;

    ssl_certificate     /etc/letsencrypt/live/kaskadyor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskadyor.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kaskadyor.uz$request_uri;
    }
}

# ── HTTPS api → home page (no API exists; decided 2026-10-12) ──────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.kaskadyor.uz;

    ssl_certificate     /etc/letsencrypt/live/kaskadyor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskadyor.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://kaskadyor.uz/;
    }
}

# ── HTTPS main site ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaskadyor.uz;

    ssl_certificate     /etc/letsencrypt/live/kaskadyor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskadyor.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/kaskadyor-cloudflare-realip.conf;

    root /root/Project/Kaskadyor.uz/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;   # static site: no uploads, no forms

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/kaskadyor-security-headers.conf;

    access_log /var/log/nginx/kaskadyor.access.log;
    error_log  /var/log/nginx/kaskadyor.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Brand imagery from public/ keeps its file names → moderate cache.
    location ^~ /assets/kaskadyor/ {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Vite output (JS, CSS, fonts): content-hashed names → cache forever.
    location ^~ /assets/ {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|ico|jpg|png|webp|txt)$ {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The page itself must always be revalidated so new deploys show up at once.
    location = / {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    # Development mode (src/lib/pages.ts): the current hero is prerendered to /demo/index.html.
    # When UNDER_DEVELOPMENT is off the file is not built and /demo is a plain 404.
    location = /demo {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        try_files /demo/index.html =404;
    }

    location ^~ /demo/ {
        return 301 /demo;
    }

    # One-page site: unknown paths are real 404s (the page is shown as the 404 body).
    location / {
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    error_page 404 /404-page.html;
    location = /404-page.html {
        internal;
        include /etc/nginx/snippets/kaskadyor-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Never serve dotfiles even if they end up in the web root.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
