# Kaskadyor.uz security headers → /etc/nginx/snippets/kaskadyor-security-headers.conf
# Included at server level AND in every location that sets its own add_header
# (nginx drops inherited add_header directives when a location defines any).
#
# script-src hash = the inline intro-skip script in index.html <head> (same on / and /demo).
# If that script is edited, recompute: see README.md → "CSP hash".
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LZYJ0eB9NjEynOz9yhiRVtGXAM+Rt5ekRNX7J14aJXU='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
